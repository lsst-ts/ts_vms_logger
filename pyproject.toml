[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-vms-logger"
description = "VMS logger records VMS data to HDF5 files and publish those to S3."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
readme = "README.rst"
urls = { documentation = "https://ts-vms-logger.lsst.io", source_code = "https://github.com/lsst-ts/ts_vms_logger"}
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[project.scripts]
vmslogger = "lsst.ts.vms.logger:run"

[tool.setuptools_scm]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
